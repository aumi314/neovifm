name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake libncursesw5-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install autoconf automake

      - name: Configure developer build
        run: |
          scripts/fix-timestamps
          if [ "$RUNNER_OS" = "macOS" ]; then
            CFLAGS='-Wno-error=gnu-folding-constant' \
              ./configure --enable-developer --without-glib
          else
            ./configure --enable-developer --without-glib
          fi

      - name: Build NeoVifm core session
        run: make -C src neovifm-core-session

      - name: Run focused C tests
        env:
          VIFM: ""
          MYVIFMRC: ""
        run: make -C tests neovifm_snapshot

      - name: Install TUI dependencies
        working-directory: clients/tui
        run: bun install --frozen-lockfile

      - name: Run TUI coverage
        working-directory: clients/tui
        run: bun run test:coverage

      - name: Type-check TUI
        working-directory: clients/tui
        run: bun run typecheck

      - name: Audit TUI dependencies
        working-directory: clients/tui
        run: bun audit

      - name: Run TUI integration tests
        working-directory: clients/tui
        run: bun run test:integration

      - name: Run full C test suite serially
        env:
          VIFM: ""
          MYVIFMRC: ""
        run: make check

      - name: Check generated worktree and whitespace
        run: git diff --check

      - name: Upload Unix test logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}-test-logs
          path: |
            src/test-suite.log
            tests/**/test-suite.log
          if-no-files-found: ignore

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            wget
            dos2unix
            mingw-w64-x86_64-gcc

      - name: Restore Windows build dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            src/PDCurses-3.8
            src/mingw-libgnurx-2.5.1
          key: windows-mingw64-deps-${{ hashFiles('patches/pdcurses38/**', 'scripts/appveyor/win/build-deps') }}

      - name: Build Windows dependencies
        shell: msys2 {0}
        run: bash scripts/appveyor/win/build-deps

      - name: Build Windows binaries
        shell: msys2 {0}
        run: bash scripts/appveyor/win/build

      - name: Verify Windows NeoVifm binaries
        shell: msys2 {0}
        run: |
          test -f src/vifm.exe
          test -f src/neovifm-core-probe.exe
          test -f src/neovifm-core-session.exe
          test -f src/neovifm-win-open.exe

      - name: Run Windows C tests, including NeoVifm focused suite
        shell: msys2 {0}
        run: bash scripts/appveyor/win/test

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install TUI dependencies
        working-directory: clients/tui
        run: bun install --frozen-lockfile

      - name: Run TUI coverage
        working-directory: clients/tui
        run: bun run test:coverage

      - name: Type-check TUI
        working-directory: clients/tui
        run: bun run typecheck

      - name: Audit TUI dependencies
        working-directory: clients/tui
        run: bun audit

      - name: Run real Windows core integration
        working-directory: clients/tui
        env:
          NEOVIFM_CORE_PROBE: ${{ github.workspace }}\src\neovifm-core-probe.exe
          NEOVIFM_CORE_SESSION: ${{ github.workspace }}\src\neovifm-core-session.exe
        run: bun test ./integration/core-probe.test.tsx ./integration/windows-baseline.test.ts

      - name: Run Windows file action integration
        working-directory: clients/tui
        env:
          NEOVIFM_CORE_SESSION: ${{ github.workspace }}\src\neovifm-core-session.exe
        run: |
          $sourceRoot = "C:\neovifm-cross-volume-actions"
          $destinationRoot = "D:\neovifm-cross-volume-actions"
          New-Item -ItemType Directory -Force -Path $sourceRoot, $destinationRoot | Out-Null
          $env:NEOVIFM_CROSS_VOLUME_SOURCE_ROOT = $sourceRoot
          $env:NEOVIFM_CROSS_VOLUME_DESTINATION_ROOT = $destinationRoot
          $exitCode = 0
          try {
            bun test ./integration/windows-actions.test.ts 2>&1 |
              Tee-Object -FilePath windows-actions-integration.log
            $exitCode = $LASTEXITCODE
          } finally {
            Remove-Item -LiteralPath $sourceRoot, $destinationRoot -Recurse -Force
          }
          exit $exitCode

      - name: Run Windows platform opener integration
        working-directory: clients/tui
        env:
          NEOVIFM_CORE_SESSION: ${{ github.workspace }}\src\neovifm-core-session.exe
        run: |
          bun test ./integration/windows-opener.test.ts 2>&1 |
            Tee-Object -FilePath windows-opener-integration.log
          exit $LASTEXITCODE

      - name: Check generated worktree and whitespace
        run: git diff --check

      - name: Upload Windows test logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-test-logs
          path: |
            tests/**/test-suite.log
            clients/tui/windows-actions-integration.log
            clients/tui/windows-opener-integration.log
          if-no-files-found: ignore

  gate:
    name: CI / gate
    if: always()
    needs:
      - unix
      - windows
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform
        env:
          UNIX_RESULT: ${{ needs.unix.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          test "$UNIX_RESULT" = success
          test "$WINDOWS_RESULT" = success
